<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CommuneScore — Île-de-France</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="layout">
      <aside id="sidebar">
        <header id="masthead">
          <h1>CommuneScore</h1>
          <p class="eyebrow">Île-de-France</p>
        </header>

        <section class="panel">
          <h2 class="panel-title">Où chercher</h2>
          <p class="panel-hint">
            Les scores sont relatifs : chaque commune est notée face aux autres
            communes de la zone choisie.
          </p>
          <div id="scope"><!-- populated by scopes.js --></div>
        </section>

        <section class="panel">
          <h2 class="panel-title">Vos priorités</h2>
          <p class="panel-hint">
            Réglez l’importance de chaque critère. La carte et le classement se
            recalculent aussitôt.
          </p>
          <div id="sliders"><!-- populated by sliders.js --></div>
        </section>

        <section class="panel">
          <h2 class="panel-title">
            Classement <span id="ranking-count" class="panel-count"></span>
          </h2>
          <ol id="ranking-list"><!-- populated by app.js --></ol>
        </section>
      </aside>

      <main id="map-container">
        <div id="map"></div>
        <div id="legend"><!-- populated by app.js --></div>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
