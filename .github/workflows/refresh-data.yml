name: Refresh commune scoring data

on:
  schedule:
    # 03:00 UTC on the 1st of every month
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      # etl/pipeline.py produces every file the frontend loads:
      # communes_scores.geojson, then the two reseau_* overlay files.
      # use real source implementations, extract, clean, transform, load
      - name: Run ETL pipeline
        run: uv run python -m etl.pipeline

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/
          git diff --cached --quiet || git commit -m "chore: refresh commune scoring data"
          git push
