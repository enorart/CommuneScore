[project]
name = "ideal-location"
version = "0.1.0"
description = "Ville Idéale IDF — ETL pipeline that produces a per-commune scoring dataset for Île-de-France"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "requests>=2.32",
    "pyarrow>=17.0",
    "polars>=1.43.0",
    "rasterio>=1.4",
    "fastexcel>=0.20.2",
]

# Only for `python -m etl.isochrone`, which builds the travel-time matrices.
# Kept out of [project.dependencies] on purpose: r5py drags in a JVM router and
# a JDK 21 requirement, and the normal pipeline must stay a light `uv sync`.
#   uv sync --group isochrone
[dependency-groups]
isochrone = [
    "r5py>=1.0",
]
