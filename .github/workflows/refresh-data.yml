name: Refresh commune scoring data

on:
  schedule:
    # 03:00 UTC on the 1st of every month
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      # TODO: etl/pipeline.py is currently a stub (raises NotImplementedError).
      # Once real source implementations land, this step will produce
      # data/processed/communes_scores.geojson.
      - name: Run ETL pipeline
        run: uv run python -m etl.pipeline

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/communes_scores.geojson
          git diff --cached --quiet || git commit -m "chore: refresh commune scoring data"
          git push
